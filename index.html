<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papan Undian Futsal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f7fc;--surf:#fff;--ink:#0f2744;--mut:#5a6c82;--line:#d6e0ec;--pitch:#1b6fc9;--pitch-ink:#fff;--ball:#e6ad45;--soft:#e4effb;--warn:#fff4dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);
 --bg:#0b1626;--surf:#12233a;--ink:#e8f0fa;--mut:#9db0c6;--line:#243a56;--pitch:#4da3ff;--pitch-ink:#06121f;--soft:#183050;
 background:var(--bg);color:var(--ink)}
h1{font:700 28px/1.1 "Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
nav button{border:0;background:transparent;font-weight:600}
nav button.on{background:var(--pitch);color:var(--pitch-ink)}
button.pri{background:var(--ball);border-color:var(--ball);color:#fff;font-weight:600;font-size:18px;padding:12px 28px}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1100px;margin:0 auto;padding:20px}
.stage{display:flex;justify-content:space-between;gap:12px;color:var(--mut);font-weight:500;margin-bottom:8px}
.stage b{color:var(--ink)}
.screen{background:var(--pitch);color:var(--pitch-ink);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:700 clamp(34px,7vw,68px)/1.05 "Barlow Condensed",Impact,sans-serif;letter-spacing:.01em;word-break:break-word}
.screen.land{animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
#info{min-height:28px;text-align:center;margin:10px 0;font-weight:500}
#info.bad{color:var(--ball)}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grp{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp h3{margin:0;padding:10px 14px;font:700 22px/1 "Barlow Condensed",Impact,sans-serif;background:var(--soft);display:flex;justify-content:space-between}
.grp h3 span{font:500 14px Barlow,sans-serif;color:var(--mut)}
.slot{padding:9px 14px;border-top:1px solid var(--line);min-height:44px;display:flex;flex-direction:column;justify-content:center}
.slot.e{color:var(--mut)}
.slot small{color:var(--mut)}
.slot.new{animation:hl 1.6s ease-out}
@keyframes hl{from{background:var(--ball);color:#fff}to{background:transparent}}
.slot.new small{color:inherit}
.note{color:var(--mut);font-size:14px;text-align:center;margin-top:16px;white-space:pre-line}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font:700 22px/1 "Barlow Condensed",Impact,sans-serif}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.row label{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:70px}
.warn{background:var(--warn);border-left:4px solid var(--ball);padding:8px 12px;border-radius:6px;margin-bottom:8px;font-size:15px}
.ok{background:var(--soft);border-left:4px solid var(--pitch);padding:8px 12px;border-radius:6px;font-size:15px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:14px;padding:4px 6px}
td{padding:4px 6px}
td input[type=text]{width:100%}
td input[type=number]{width:60px}
@media(prefers-reduced-motion:reduce){.screen.land,.slot.new{animation:none}}
@media print{header,.bar,#info,nav{display:none}}
.brand{display:flex;align-items:center;gap:12px}
#logo{height:52px;width:auto}
.logo{height:56px;width:auto}
.screen{background:linear-gradient(160deg,#1f7fd9,#134a8c);color:#fff;border-bottom:6px solid var(--ball);flex-direction:column;gap:8px;min-height:200px}
.screen .sc{font:500 20px Barlow,sans-serif;opacity:.9}
.why{max-width:640px;margin:0 auto 14px;text-align:center;color:var(--mut);font-size:15px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:contain;background:var(--soft);color:var(--pitch);font-weight:700;flex:none}
.screen .av{background:#fff}
.slot.s2{flex-direction:row;align-items:center;gap:10px}
.slot.s2 small{display:block}
button.pri{color:#13243b}
@keyframes hl{from{background:var(--ball);color:#13243b}to{background:transparent}}
#pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.pot{background:var(--surf);border:1px solid var(--line);border-top:4px solid var(--ball);border-radius:10px;padding:12px 14px}
.pot h4{margin:0 0 4px;font:700 22px/1.1 "Barlow Condensed",Impact,sans-serif}
.pot h4 span{font:500 14px Barlow,sans-serif;color:var(--mut);margin-left:6px}
.pot p{margin:0 0 10px;color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:14px}
.chip.dn{opacity:.4;text-decoration:line-through}
.fbtn{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fbtn:focus-within{outline:2px solid var(--ball)}
table{min-width:780px}
#teamCard{margin-top:22px}
button.add{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink);font-weight:600}

/* tombol suara */
#snd{display:inline-flex;align-items:center;gap:6px;font-weight:600}
#snd svg{width:18px;height:18px;flex:none}
#snd.off{opacity:.7;color:var(--mut)}
#snd .x{display:none}
#snd.off .x{display:inline}
#snd.off .w{display:none}

/* modal */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:rgba(8,18,32,.6);backdrop-filter:blur(2px);animation:fade .15s ease-out}
.ov[hidden]{display:none}
.dlg{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--pitch);border-radius:14px;width:100%;max-width:440px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .2s cubic-bezier(.2,.9,.3,1.1)}
.dlg.warn-t{border-top-color:var(--ball)}
.dlg.err-t{border-top-color:#d64545}
.dlg.ok-t{border-top-color:#2e9e5b}
.dlg h2{margin:0;padding:18px 20px 0;font:700 24px/1.1 "Barlow Condensed",Impact,sans-serif}
.dlg .mb{padding:10px 20px 4px;overflow-y:auto;color:var(--ink);overflow-wrap:anywhere}
.dlg .mb p{margin:0 0 8px}
.dlg .mb ul{margin:6px 0 0;padding-left:20px}
.dlg .mb li{margin-bottom:4px}
.dlg .mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px 18px}
.dlg .mf button{min-height:42px;min-width:96px;font-weight:600}
.dlg .mf .pri{font-size:16px;padding:10px 22px}
.dlg .mf .dng{background:#d64545;border-color:#d64545;color:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
body.mo{overflow:hidden}
@media(max-width:520px){
 .ov{align-items:flex-end;padding:0}
 .dlg{max-width:none;border-radius:16px 16px 0 0;max-height:85dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
 .dlg .mf{flex-direction:column-reverse}
 .dlg .mf button{width:100%}
}
/* validasi */
.bad-f{border-color:#d64545!important;background:color-mix(in srgb,#d64545 8%,var(--bg))}
.ferr{color:#d64545;font-size:13px;margin:2px 0 0;min-height:0}
.ferr:empty{display:none}
.fw{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cnt-h{color:var(--mut);font-size:12px}
/* responsif tambahan */
@media(max-width:640px){
 header{padding:12px 14px}h1{font-size:22px}#logo{height:40px}
 main{padding:14px}
 nav{width:100%}nav button{flex:1}
 .bar button{flex:1 1 calc(50% - 8px)}.bar button.pri{flex-basis:100%}
 .row{flex-direction:column;align-items:stretch}
 .row label{flex-wrap:wrap}
 input[type=text],input[type=number]{width:100%;font-size:16px}
 textarea{font-size:16px}
 .stage{flex-direction:column;gap:2px}
 #pots{grid-template-columns:1fr}
}
@media(max-width:720px){
 table{min-width:0}
 thead{display:none}
 tr{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:var(--bg)}
 td{display:block;padding:4px 0}
 td[data-l]::before{content:attr(data-l);display:block;color:var(--mut);font-size:12px;font-weight:600;margin-bottom:2px}
 td input[type=text]{width:100%}
}

/* v3: layar, grup, mode layar, log */
.screen{min-height:300px}
.screen .gtag{margin-top:6px;background:var(--ball);color:#13243b;border-radius:999px;padding:4px 24px;font:700 clamp(22px,4.5vw,40px)/1.2 "Barlow Condensed",Impact,sans-serif;letter-spacing:.06em;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.screen .gtag.hid{visibility:hidden;animation:none}
.grp.hit{outline:3px solid var(--ball);outline-offset:-3px;animation:hitp 1.2s ease-out 2}
@keyframes hitp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ball) 35%,transparent)}}
.slot.new{animation:hl 3s ease-out}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#pjx{display:none;position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:8px;z-index:95;opacity:.6}
body.pj #pjx{display:block}
body.pj header nav,body.pj #teamCard,body.pj #logd,body.pj .bar button:not(#go):not(#snd),body.pj .note{display:none}
body.pj header{justify-content:center}
body.pj .screen{min-height:42vh}
#logd summary{cursor:pointer;font-weight:600}
.lg{white-space:pre-wrap;margin:10px 0 0;font:14px/1.7 Barlow,system-ui,sans-serif;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.screen .gtag,.grp.hit,.slot.new{animation:none}}

/* v4: satu layar di desktop */
@media(min-width:1000px){
 header{padding:8px 20px}#logo{height:40px}h1{font-size:26px}
 main{max-width:1760px;padding:10px 20px}
 #draw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:16px;align-items:start}
 #draw>*{grid-column:1/-1}
 #draw>.stage{grid-row:1;margin-bottom:6px}
 #draw>.screen{grid-column:1;grid-row:2;min-height:250px;padding:12px;gap:4px;font-size:clamp(30px,3.6vw,54px)}
 #draw>#info{grid-column:1;grid-row:3;min-height:22px;margin:6px 0 0}
 #draw>#why{grid-column:1;grid-row:4;margin:0 0 6px;font-size:14px;max-width:none}
 #draw>.bar{grid-column:1;grid-row:5;margin-bottom:10px}
 #draw>.bar button{padding:6px 12px}#draw>.bar button.pri{padding:8px 22px;font-size:17px}
 #draw>#pots{grid-column:2;grid-row:2/6;display:flex;flex-direction:column;gap:8px;margin:0;align-self:stretch}
 #draw>#pots .pot{padding:8px 12px;flex:1}
 #pots .pot h4{font-size:19px}#pots .pot p{font-size:12px;margin-bottom:6px}
 #pots .chip{font-size:13px;padding:2px 10px 2px 3px}
 #pots .chip .av{width:30px!important;height:30px!important;font-size:11px!important}
 #draw>#board{grid-row:6}
 #draw>#logd{grid-row:7;margin-top:12px}
 #draw>#teamCard{grid-row:8}
 .screen .av{width:100px!important;height:100px!important;font-size:34px!important}
 .screen .sc{font-size:17px}
 .screen .gtag{font-size:clamp(20px,2.4vw,32px);padding:2px 20px;margin-top:2px}
 .grid{grid-template-columns:repeat(var(--gc,4),minmax(0,1fr));gap:10px}
 .grp h3{padding:6px 12px;font-size:20px}
 .slot{padding:4px 10px;min-height:52px}
 .slot .av{width:44px!important;height:44px!important;font-size:15px!important}
 .slot b{font-size:15px;line-height:1.2}.slot small{font-size:12px;line-height:1.2}
 body.pj .screen{min-height:200px}
}
/* logo transparan */
img.av{background:transparent;border:0;border-radius:0;padding:0;box-sizing:border-box}
.screen img.av{background:transparent;border-radius:0;padding:0}
.slot.s2{justify-content:flex-start}
/* v5: efek membesar pada tombol + perbaikan halaman Pengaturan */
[hidden]{display:none!important}
button,.fbtn{transition:transform .16s cubic-bezier(.2,.9,.3,1.35),box-shadow .16s}
button:not(:disabled):active,.fbtn:active{transform:scale(.95)}
button:not(:disabled):focus-visible{transform:scale(1.05)}
@media(hover:hover){
 button:not(:disabled):hover,.fbtn:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(15,39,68,.2)}
 button.pri:not(:disabled):hover{transform:scale(1.1)}
}
@media(prefers-reduced-motion:reduce){
 button,.fbtn{transition:none}
 button:not(:disabled):hover,button:not(:disabled):active,button:not(:disabled):focus-visible,.fbtn:hover,.fbtn:active{transform:none}
}

/* v6: logo besar dan jelas */
#logo{height:var(--lh,80px);width:auto;max-width:40vw;object-fit:contain}
.idlelogo{height:clamp(150px,26vh,260px);max-width:80%;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4));animation:pop .6s cubic-bezier(.2,.9,.3,1.2)}
.idletx{font-size:.45em;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
@media(max-width:640px){#logo{height:calc(var(--lh,80px)*.7)}.idlelogo{height:clamp(120px,22vh,180px)}}
@media(min-width:1000px){header{padding:6px 20px}#logo{height:calc(var(--lh,80px)*.8)}h1{font-size:30px}#draw>.screen{min-height:310px}.idlelogo{height:clamp(150px,24vh,230px)}}
body.pj #logo{height:calc(var(--lh,80px)*1.6)}
body.pj h1{font-size:clamp(28px,4vw,54px)}
body.pj .idlelogo{height:clamp(200px,34vh,420px)}
@media(prefers-reduced-motion:reduce){.idlelogo{animation:none}}

/* v7: logo tim di dalam grup lebih besar */
.slot.s2{gap:14px;min-height:76px;padding:8px 14px}
.slot .av{width:60px!important;height:60px!important;font-size:20px!important}
.slot b{font-size:18px;line-height:1.2}
.slot small{font-size:13px}
@media(min-width:1000px){
 .slot{padding:6px 12px;min-height:72px}
 .slot .av{width:64px!important;height:64px!important;font-size:22px!important}
 .slot b{font-size:18px}.slot small{font-size:13px}
 .slot.e{min-height:72px}
}
@media(max-width:640px){.slot .av{width:52px!important;height:52px!important}}
body.pj .slot .av{width:72px!important;height:72px!important}

/* v8: papan tetap satu layar, ukuran ikut tinggi layar */
@media(min-width:1000px){
 #logo{height:calc(var(--lh,80px)*.7)}
 header{padding:4px 20px}
 main{padding:8px 20px}
 #draw>.stage{margin-bottom:4px}
 #draw>.screen{min-height:clamp(190px,29vh,310px)}
 .idlelogo{height:clamp(100px,calc(29vh - 62px),230px)}
 .screen .av{width:clamp(64px,11vh,100px)!important;height:clamp(64px,11vh,100px)!important}
 #draw>.bar{gap:6px;margin-bottom:8px}
 #draw>.bar button{padding:5px 10px;font-size:14px}
 #draw>.bar button.pri{padding:7px 18px;font-size:16px}
 .slot .av{width:clamp(38px,6.6vh,64px)!important;height:clamp(38px,6.6vh,64px)!important;font-size:17px!important}
 .slot,.slot.e,.slot.s2{min-height:calc(clamp(38px,6.6vh,64px) + 8px);padding:4px 12px}
 .slot b{font-size:clamp(15px,2vh,18px)}
 .grp h3{padding:4px 12px}
}

@media(min-width:1000px){
 #draw{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
 #draw>.bar{gap:5px;flex-wrap:nowrap}
 #draw>.bar button{padding:5px 8px;font-size:13px;white-space:nowrap}
 #draw>.bar button.pri{padding:7px 16px;font-size:15px}
}

@media(min-width:1000px){
 #draw{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
 #draw>#pots{contain:size;overflow:auto;min-height:0}
 #draw>#pots .pot{min-height:0;overflow:hidden}
}

@media(min-width:1000px) and (max-height:780px){
 #pots .pot p{display:none}
 #pots .chip{font-size:12px;padding:1px 8px 1px 2px}
 #pots .chip .av{width:22px!important;height:22px!important;font-size:9px!important}
 #pots .chips{gap:4px}
 #pots .pot h4{font-size:17px;margin-bottom:4px}
}

/* v9: acuan Full HD 1920 px, otomatis membesar di monitor lebih besar */
@media(min-width:1000px){
 main{max-width:2400px;padding:calc(var(--vh,1vh)*.9) 20px}
 h1{font-size:clamp(26px,calc(var(--vh,1vh)*3.4),56px)}
 #logo{height:calc(var(--lh,80px)*.8)}
 .stage{font-size:clamp(15px,calc(var(--vh,1vh)*1.9),26px)}
 #draw>.screen{min-height:clamp(190px,calc(var(--vh,1vh)*32),480px);font-size:clamp(30px,calc(var(--vh,1vh)*5.6),84px)}
 .idlelogo{height:clamp(100px,calc(var(--vh,1vh)*32 - 62px),380px)}
 .idletx{font-size:clamp(16px,calc(var(--vh,1vh)*2.4),34px)}
 .screen .av{width:clamp(64px,calc(var(--vh,1vh)*12),160px)!important;height:clamp(64px,calc(var(--vh,1vh)*12),160px)!important}
 .screen .sc{font-size:clamp(17px,calc(var(--vh,1vh)*2.2),32px)}
 .screen .gtag{font-size:clamp(20px,calc(var(--vh,1vh)*3.4),50px)}
 #draw>#info{font-size:clamp(16px,calc(var(--vh,1vh)*1.9),26px)}
 #draw>#why{font-size:clamp(14px,calc(var(--vh,1vh)*1.6),22px)}
 #draw>.bar button{font-size:clamp(13px,calc(var(--vh,1vh)*1.55),22px)}
 #draw>.bar button.pri{font-size:clamp(15px,calc(var(--vh,1vh)*1.9),26px)}
 .slot .av{width:clamp(38px,calc(var(--vh,1vh)*6.8),96px)!important;height:clamp(38px,calc(var(--vh,1vh)*6.8),96px)!important}
 .slot,.slot.e,.slot.s2{min-height:calc(clamp(38px,calc(var(--vh,1vh)*6.8),96px) + 8px)}
 .slot b{font-size:clamp(15px,calc(var(--vh,1vh)*2),26px)}
 .slot small{font-size:clamp(12px,calc(var(--vh,1vh)*1.5),19px)}
 .slot.e{font-size:clamp(14px,calc(var(--vh,1vh)*1.7),22px)}
 .grp h3{font-size:clamp(20px,calc(var(--vh,1vh)*2.4),32px)}
 .grp h3 span{font-size:clamp(13px,calc(var(--vh,1vh)*1.5),19px)}
 #pots .pot h4{font-size:clamp(19px,calc(var(--vh,1vh)*2.3),30px)}
 #pots .pot p{font-size:clamp(12px,calc(var(--vh,1vh)*1.45),18px)}
 #pots .chip{font-size:clamp(13px,calc(var(--vh,1vh)*1.55),20px)}
 #pots .chip .av{width:clamp(30px,calc(var(--vh,1vh)*3.4),48px)!important;height:clamp(30px,calc(var(--vh,1vh)*3.4),48px)!important}
 body.pj #draw>.screen{min-height:calc(var(--vh,1vh)*40)}
 body.pj h1{font-size:clamp(28px,calc(var(--vh,1vh)*5),72px)}
}
@media(min-width:1000px) and (max-height:780px){
 #pots .chip{font-size:12px}
 #pots .chip .av{width:22px!important;height:22px!important}
 #pots .pot h4{font-size:17px}
}

@media(min-width:1000px) and (max-height:700px){
 .slot .av{width:36px!important;height:36px!important}
 .slot,.slot.e,.slot.s2{min-height:44px}
}

   const g=Math.min(8,Math.max(2,raw));if(g!==raw)notify('Jumlah grup tidak valid','Jumlah grup harus antara 2 sampai 8. Nilai disesuaikan menjadi '+g+'.','warn');S.groups=g;D.r=[];v.value=g}
  else if(k=='spin'){S.spin=Math.min(8,Math.max(1,Math.round(+v.value)||3));$('#spv').textContent=S.spin}
  else S[k]=t=='b'?v.checked:v.value;
  check();mark();render()});
$('#sGroups').addEventListener('blur',e=>{if(e.target.value===''||isNaN(+e.target.value))e.target.value=S.groups});
bind('#sTitle','title');bind('#sR1','r1');bind('#sR2','r2');bind('#sGroups','groups','n');bind('#sCo','sameCo','b');bind('#sSpin','spin','n');bind('#sSnd','snd','b');bind('#sShowCo','showCo','b');bind('#sUndo','undo','b');
$('#tbody').addEventListener('input',e=>{const t=e.target,i=t.dataset.i,f=t.dataset.f;if(f==null)return;if(f=='s'||f=='c')D.r=[];S.teams[i][f]=f=='s'?t.checked:f=='p'?(+t.value||0):t.value;check();mark();render()});
$('#tbody').addEventListener('click',async e=>{if(e.target.dataset.rl!=null){S.teams[+e.target.dataset.rl].l='';renderSet();render();return}const d=e.target.dataset.del;if(d==null||locked())return;
  const t=S.teams[+d];
  if(S.teams.length<=2){notify('Tim tidak bisa dihapus','Minimal harus ada 2 tim.','warn');return}
  if(!await ask('Hapus tim ini?','"'+(t.n.trim()||'Tim '+(+d+1))+'" akan dihapus dari daftar.',{yes:'Ya, hapus',danger:true}))return;
  S.teams.splice(+d,1);D.r=[];renderSet();render()});
$('#addT').onclick=()=>{if(locked())return;if(S.teams.length>=64){notify('Batas tim tercapai','Maksimal 64 tim.','warn');return}S.teams.push({n:'Tim '+(S.teams.length+1),c:'',r:'',l:'',s:false});D.r=[];renderSet();render()};
const av=(t,z)=>t.l?'<img class="av" style="width:'+z+'px;height:'+z+'px" src="'+t.l+'" alt="">':'<span class="av" style="width:'+z+'px;height:'+z+'px;font-size:'+Math.round(z*.4)+'px">'+esc((t.n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2)||'?').toUpperCase())+'</span>';
function renderPots(){const all=S.teams.map((t,i)=>({...t,i})),p1=all.filter(t=>t.s),p2=all.filter(t=>!t.s);
 const chip=t=>'<div class="chip'+(done(t.i)?' dn':'')+'">'+av(t,28)+'<span>'+esc(t.n)+'</span></div>';
 $('#pots').innerHTML='<div class="pot"><h4>Pot 1<span>'+p1.length+' tim, diundi lebih dulu</span></h4><p>'+esc(S.r1)+'</p><div class="chips">'+p1.map(chip).join('')+'</div></div><div class="pot"><h4>Pot 2<span>'+p2.length+' tim, menyusul setelah Pot 1</span></h4><p>'+esc(S.r2)+'</p><div class="chips">'+p2.map(chip).join('')+'</div></div>'}

// ===== logo: hapus latar putih/abu-abu terang dari tepi gambar =====
function clearBg(u){return new Promise(ok=>{const im=new Image();im.onerror=()=>ok(u);im.onload=()=>{
  const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);
  let d;try{d=x.getImageData(0,0,w,h)}catch(e){return ok(u)}
  const a=d.data,W=p=>{const t=p*4;return a[t+3]<10||(a[t]>235&&a[t+1]>235&&a[t+2]>235)},seen=new Uint8Array(w*h),q=[];
  const push=p=>{if(p<0||p>=w*h||seen[p]||!W(p))return;seen[p]=1;q.push(p)};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(q.length){const p=q.pop(),px=p%w;a[p*4+3]=0;push(p+w);push(p-w);if(px>0)push(p-1);if(px<w-1)push(p+1)}
  x.putImageData(d,0,0);ok(c.toDataURL('image/png'))};im.src=u})}
function img(file,max,cb){if(!file.type||!file.type.startsWith('image/')){notify('File tidak didukung','Pilih file gambar (PNG, JPG, WebP, atau SVG).','error');return}
  if(file.size>LIM.logo){notify('Ukuran file terlalu besar','Ukuran logo maksimal '+(LIM.logo/1024/1024)+' MB. File ini '+(file.size/1024/1024).toFixed(1)+' MB.','error');return}
  const fr=new FileReader();fr.onerror=()=>notify('Gagal membaca file','File gambar tidak bisa dibaca. Coba file lain.','error');fr.onload=()=>{const im=new Image();im.onerror=()=>notify('Gambar rusak','File tidak dapat dibuka sebagai gambar. Coba file lain.','error');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);clearBg(c.toDataURL('image/png')).then(cb)};im.src=fr.result};fr.readAsDataURL(file)}
$('#tbody').addEventListener('change',e=>{const i=e.target.dataset.lg;if(i==null||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';img(f,160,u=>{S.teams[i].l=u;renderSet();render()})});
$('#sLogo').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)img(f,320,u=>{S.logo=u;renderSet();render()})});
$('#sLogoR').onclick=()=>{S.logo='';renderSet();render()};
const pjOn=()=>document.body.classList.contains('pj');
async function pjSet(on){document.body.classList.toggle('pj',on);
 try{if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch(e){}}
$('#pj').onclick=()=>pjSet(true);$('#pjx').onclick=()=>pjSet(false);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&pjOn())document.body.classList.remove('pj')});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const g=e.target,n=g&&g.tagName;
 if(n==='INPUT'||n==='TEXTAREA'||n==='SELECT'||n==='BUTTON'||(g&&g.isContentEditable))return;
 if(!$('#ov').hidden||$('#draw').hidden)return;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)$('#go').click()}
 else if(e.key==='f'||e.key==='F'){pjSet(!pjOn())}
 else if(e.key==='m'||e.key==='M'){toggleSnd()}});

// ===== import / template Excel =====
let xlsxP=null;
function loadX(){if(window.XLSX)return Promise.resolve();
 return xlsxP=xlsxP||new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{xlsxP=null;no(new Error('load'))};document.head.appendChild(s)})}
const TRUE_=/^(1|y|ya|yes|true|x|v|ok|pot ?1|unggulan|seed)$/i;
function parseRows(rows){
 rows=rows.filter(r=>r.some(c=>String(c??'').trim()));
 if(!rows.length)return [];
 const norm=v=>String(v??'').trim().toLowerCase();
 const h=rows[0].map(norm),find=re=>h.findIndex(x=>re.test(x));
 let n=find(/^(nama( tim)?|tim|team)$/),c=find(/perusahaan|company|instansi/),r=find(/keterangan|alasan|catatan|note/),s=find(/pot ?1|unggulan|seed/);
 let body=rows;
 if(n>=0)body=rows.slice(1);else{n=0;c=1;r=2;s=3}
 return body.map(x=>({n:String(x[n]??'').trim().slice(0,LIM.name),c:c>=0?String(x[c]??'').trim().slice(0,LIM.co):'',r:r>=0?String(x[r]??'').trim().slice(0,LIM.reason):'',l:'',s:s>=0?TRUE_.test(String(x[s]??'').trim()):false})).filter(t=>t.n);
}
$('#impT').onclick=()=>{if(locked()){notify('Tidak bisa import','Undian sudah berjalan. Reset undian dulu sebelum mengganti daftar tim.','warn');return}$('#impF').click()};
$('#impF').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{await loadX()}catch(x){notify('Gagal memuat pembaca Excel','Perlu koneksi internet sekali untuk memuat pustaka Excel. Coba lagi saat online.','error');return}
 let rows;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
 catch(x){notify('File tidak bisa dibaca','Pastikan file berformat .xlsx, .xls, atau .csv.','error');return}
 let t=parseRows(rows);
 if(!t.length){notify('Tidak ada tim','Tidak ada nama tim yang ditemukan. Kolom pertama harus berisi nama tim (lihat "Unduh template").','warn');return}
 const w=[];
 if(t.length>64){w.push(t.length+' baris ditemukan, hanya 64 pertama yang dipakai.');t=t.slice(0,64)}
 const seen={},dup=[];t=t.filter(x=>{const k=x.n.toLowerCase();if(seen[k]){dup.push(x.n);return false}seen[k]=1;return true});
 if(dup.length)w.push('Nama kembar dilewati: '+dup.join(', ')+'.');
 if(t.length!==16)w.push('Jumlah tim yang diimport '+t.length+' (bukan 16).');
 if(!await ask('Import '+t.length+' tim?','Daftar tim saat ini ('+S.teams.length+' tim) akan diganti dengan isi file "'+f.name+'". Logo tim akan kosong.',{yes:'Ya, ganti',list:w}))return;
 S.teams=t;D.r=[];log('Import Excel: '+t.length+' tim dari '+f.name);renderSet();render();
 notify('Import berhasil',t.length+' tim dimasukkan ke daftar.','ok',w);
});
$('#tplT').onclick=async()=>{
 try{await loadX()}catch(x){notify('Gagal memuat pembaca Excel','Perlu koneksi internet sekali untuk memuat pustaka Excel.','error');return}
 const d=[['Nama tim','Perusahaan','Keterangan','Pot 1']];
 for(let i=1;i<=16;i++)d.push(['Tim '+i,'','',i<=4?'Ya':'']);
 const ws=XLSX.utils.aoa_to_sheet(d);ws['!cols']=[{wch:28},{wch:24},{wch:32},{wch:8}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tim');XLSX.writeFile(wb,'template-tim-undian.xlsx')};
S.pot=false;
function idleScr(){const lg=S.logo||LOGO;$('#scr').innerHTML=(lg&&S.big!==false?'<img class="idlelogo" alt="" src="'+lg+'">':'')+'<div class="idletx">Siap diundi</div>'}
$('#sLz').addEventListener('input',e=>{S.lz=+e.target.value;$('#lzv').textContent=S.lz;render()});
$('#sBig').addEventListener('change',e=>{S.big=e.target.checked;idleScr();render()});
function fit(){const w=innerWidth,h=innerHeight;let z=1;if(w>=1000){const pj=document.body.classList.contains('pj');z=Math.max(1,Math.min(w/(pj?1600:1920),h/(pj?780:950)))};const r=document.documentElement;r.style.zoom=z>1.005?z:'';r.style.setProperty('--vh',(h/z/100)+'px');r.style.setProperty('--vw',(w/z/100)+'px')}
addEventListener('resize',fit);new MutationObserver(fit).observe(document.body,{attributes:true,attributeFilter:['class']});fit();
renderSet();render();idleScr();
// bersihkan latar logo yang sudah tersimpan (sekali saja)
(async()=>{if(S.logoClean)return;try{for(const t of S.teams)if(t.l)t.l=await clearBg(t.l);if(S.logo)S.logo=await clearBg(S.logo);S.logoClean=1;renderSet();render()}catch(e){}})();
